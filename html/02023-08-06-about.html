<article class="prose">
  <p>所有人类都在一辆旅行列车上，列车的前方通向死亡。</p>
<p>一方面我们为人类文明的延续而探索，一方面我们为自己和身边人的幸福而努力。这两个方面最终都统一到了【熵减】上。</p>
<p>我当前是<strong>RVBUST</strong>的创始人，通过研发智能手眼产品，让工农业生产变得更简单。</p>
<p>未来我也会尝试音乐和文学创作，让自己和身边的人变得更简单、快乐。</p>
<p>也希望在人生的旅程中，自己有好运气，遇到更多有趣的人。</p>
<p>如果有必要，通过这个邮箱可以联系到我： bugway@gmail.com</p>
