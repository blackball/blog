<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <!-- generated by build.py; edit posts/ or templates/ instead -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page_title}}</title>
  <meta name="description" content="{{meta_description}}">
  <meta name="author" content="{{meta_author}}">
  <meta name="generator" content="build.py">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f4ed">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:site_name" content="{{site_title}}">
  <meta property="og:type" content="{{og_type}}">
  <meta property="og:title" content="{{page_title}}">
  <meta property="og:description" content="{{meta_description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{page_title}}">
  <meta name="twitter:description" content="{{meta_description}}">
  {{article_meta}}
  {{structured_data}}
  <link rel="icon" href="{{favicon_href}}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ico_href}}" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&amp;family=Zhi+Mang+Xing&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{css_href}}">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <div class="page">
    <main id="main">
      {{content}}
    </main>

    <footer class="site-footer">
      <p>{{footer_motto}}</p>
    </footer>
  </div>
</body>
</html>
