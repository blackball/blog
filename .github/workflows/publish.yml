name: Build and publish

on:
  push:
    branches: [gh-pages, main, master]
    paths:
      - "posts/**"
      - "templates/**"
      - "assets/**"
      - "imgs/**"
      - "site.json"
      - "build.py"
      - "requirements.txt"
      - "CNAME"
      - "favicon.ico"
      - ".nojekyll"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the site
        run: python build.py

      - name: Prepare the public site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.dsh-tmp' \
            --exclude='__pycache__' \
            --exclude='Editor' \
            --exclude='docs' \
            --exclude='posts' \
            --exclude='templates' \
            --exclude='.source' \
            --exclude='build.py' \
            --exclude='new_post.py' \
            --exclude='site.json' \
            --exclude='requirements.txt' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
